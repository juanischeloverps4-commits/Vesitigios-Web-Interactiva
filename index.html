    <script>
      (function() {
        function enableFetchSetter(target) {
          if (!target) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            var origFetch = (desc && desc.value) || target.fetch || (typeof window !== 'undefined' ? window.fetch : null);
            var current = origFetch;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() { return current; },
                set: function(val) { current = val; },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              try {
                Object.defineProperty(target, 'fetch', {
                  value: origFetch,
                  writable: true,
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          } catch (e) {}
        }

        enableFetchSetter(window);
        if (typeof Window !== 'undefined' && Window.prototype) {
          enableFetchSetter(Window.prototype);
        }
        if (typeof globalThis !== 'undefined') {
          enableFetchSetter(globalThis);
        }

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          var str = String(msg || '') + ' ' + String(url || '') + ' ' + (err && err.stack ? String(err.stack) : '');
          if (
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('Cannot set property fetch') !== -1 ||
            str.indexOf('only a getter') !== -1 ||
            str.indexOf('requests.js') !== -1 ||
            str.indexOf('200.js') !== -1
          ) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          var errStr = String(event.message || '') + ' ' + String(event.filename || '') + ' ' + (event.error && event.error.stack ? String(event.error.stack) : '');
          if (
            errStr.indexOf('chrome-extension://') !== -1 ||
            errStr.indexOf('Cannot set property fetch') !== -1 ||
            errStr.indexOf('only a getter') !== -1 ||
            errStr.indexOf('requests.js') !== -1 ||
            errStr.indexOf('200.js') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var reasonStr = String((reason && (reason.message || reason.stack)) || reason || '');
          if (
            reasonStr.indexOf('chrome-extension://') !== -1 ||
            reasonStr.indexOf('Cannot set property fetch') !== -1 ||
            reasonStr.indexOf('only a getter') !== -1 ||
            reasonStr.indexOf('requests.js') !== -1 ||
            reasonStr.indexOf('200.js') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
